name: IndexNow

# Submit the sitemap's URLs to IndexNow after each push to master. Vercel
# deploys master in under a minute and doesn't report deployments back to
# GitHub for this project, so the job waits for the deploy to finish first.
# It can also be run by hand from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the Vercel deploy
        if: github.event_name == 'push'
        run: sleep 150
      - run: node scripts/indexnow.mjs
        env:
          SITE_URL: https://huzaifa.codes
