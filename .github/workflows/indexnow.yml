name: IndexNow

# Submit the sitemap's URLs to IndexNow after a successful production deploy.
# Vercel tells GitHub about deploys through a repository_dispatch event
# (vercel.deployment.success); older setups send deployment_status instead,
# so both are handled. It can also be run by hand from the Actions tab.
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  deployment_status:
  workflow_dispatch:

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production') ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
        startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
        env:
          SITE_URL: https://huzaifa.codes
