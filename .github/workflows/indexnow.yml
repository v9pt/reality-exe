name: IndexNow

# Vercel reports each deployment back to GitHub. When a production deployment
# succeeds, submit the sitemap's URLs to IndexNow.
on:
  deployment_status:

jobs:
  submit:
    # Vercel names the environment "Production – <project>", so match the start.
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
        env:
          SITE_URL: https://huzaifa.codes
